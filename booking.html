<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Book a Session — ABC Tutoring</title>
<link rel="stylesheet" href="style.css" />

<body>

<header class="site-header">
  <div class="logo">ABC Tutoring</div>
  <nav class="site-nav">
    <a href="index.html">Home</a>
    <a href="tutors.html">Our Tutors</a>
    <a href="booking.html" class="active">Book a Session</a>
  </nav>
</header>

<main>
  <h1 class="section-title" style="margin-top:0;">Book a Session</h1>

  <div class="booking-box">

    <div class="form-group">
      <label for="tutorSelect">Tutor</label>
      <select id="tutorSelect"></select>
    </div>

    <div class="form-group">
      <label>Available Time Slots</label>
      <div class="slot-options" id="slotOptions"></div>
      <p class="no-slots-msg" id="noSlotsMsg" style="display:none;">
        This tutor has no open slots right now — please choose another tutor.
      </p>
    </div>

    <form id="bookingForm">
      <div class="form-group">
        <label for="parentName">Parent Name</label>
        <input type="text" id="parentName" required />
      </div>
      <div class="form-group">
        <label for="parentEmail">Parent Email</label>
        <input type="email" id="parentEmail" required />
      </div>
      <div class="form-group">
        <label for="studentName">Student First Name</label>
        <input type="text" id="studentName" required />
      </div>
      <div class="form-group">
        <label for="studentGrade">Student Grade</label>
        <input type="text" id="studentGrade" placeholder="e.g. 6th grade" required />
      </div>
      <div class="form-group">
        <label>Subject</label>
        <input type="text" id="subjectDisplay" disabled />
      </div>

      <button type="submit" class="btn" id="submitBtn">Confirm Booking</button>
    </form>

    <div class="confirmation-box" id="confirmationBox" style="display:none;">
      <h2>You're booked! 🎉</h2>
      <p id="confirmationText"></p>
      <p>A confirmation email has been sent to you and to your tutor.</p>
      <a href="tutors.html" class="btn secondary">Back to Tutors</a>
    </div>

  </div>
</main>

<footer>&copy; 2026 ABC Tutoring. Made with care for local families.</footer>

<script src="script.js"></script>
<script>
  const tutorSelect = document.getElementById("tutorSelect");
  const slotOptions = document.getElementById("slotOptions");
  const noSlotsMsg = document.getElementById("noSlotsMsg");
  const subjectDisplay = document.getElementById("subjectDisplay");
  const bookingForm = document.getElementById("bookingForm");
  const confirmationBox = document.getElementById("confirmationBox");
  const confirmationText = document.getElementById("confirmationText");
  const submitBtn = document.getElementById("submitBtn");

  let selectedSlot = null;
  let hasStartedBooking = false;

  TUTORS.forEach((t) => {
    const opt = document.createElement("option");
    opt.value = t.id;
    opt.textContent = `${t.name} (${t.subject}, Grades ${t.grades})`;
    tutorSelect.appendChild(opt);
  });

  const preselectId = getQueryParam("tutor");
  if (preselectId && getTutorById(preselectId)) {
    tutorSelect.value = preselectId;
  }

  function renderSlots() {
    const tutor = getTutorById(tutorSelect.value);
    subjectDisplay.value = tutor.subject;
    slotOptions.innerHTML = "";
    selectedSlot = null;

    const available = getAvailableSlots(tutor);
    if (available.length === 0) {
      noSlotsMsg.style.display = "block";
      submitBtn.disabled = true;
      return;
    }
    noSlotsMsg.style.display = "none";
    submitBtn.disabled = false;

    available.forEach((slot) => {
      const el = document.createElement("div");
      el.className = "slot-option";
      el.textContent = slot;
      el.addEventListener("click", () => {
        document.querySelectorAll(".slot-option").forEach((s) => s.classList.remove("selected"));
        el.classList.add("selected");
        selectedSlot = slot;
        maybeFireBookingStarted(tutor);
      });
      slotOptions.appendChild(el);
    });
  }

  function maybeFireBookingStarted(tutor) {
    if (!hasStartedBooking) {
      hasStartedBooking = true;
      track("booking_started", { tutor_name: tutor.name, subject: tutor.subject });
    }
  }

  tutorSelect.addEventListener("change", renderSlots);
  renderSlots();

  bookingForm.addEventListener("submit", (e) => {
    e.preventDefault();
    const tutor = getTutorById(tutorSelect.value);

    if (!selectedSlot) {
      alert("Please select a time slot.");
      return;
    }

    bookSlot(tutor.id, selectedSlot);

    track("booking_completed", {
      tutor_name: tutor.name,
      subject: tutor.subject,
      slot: selectedSlot
    });

    confirmationText.textContent =
      `${document.getElementById("studentName").value} is booked with ${tutor.name} for ${tutor.subject} on ${selectedSlot}.`;

    bookingForm.style.display = "none";
    confirmationBox.style.display = "block";
  });
</script>
</body>
</html>
