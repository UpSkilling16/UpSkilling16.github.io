<header class="site-header">
  <div class="logo">ABC Tutoring</div>
  <nav class="site-nav">
    <a href="index.html">Home</a>
    <a href="tutors.html" class="active">Our Tutors</a>
    <a href="booking.html">Book a Session</a>
  </nav>
</header>

<main>
  <h1 class="section-title" style="margin-top:0;">Meet Our Tutors</h1>
  <p style="color:var(--text-muted); margin-top:-6px;">Tap a tutor to view their availability and book a session.</p>

  <div class="tutor-grid" id="tutorGrid"></div>
</main>

<footer>&copy; 2026 ABC Tutoring. Made with care for local families.</footer>

<script src="script.js"></script>
<script>
  const grid = document.getElementById("tutorGrid");

  TUTORS.forEach((tutor) => {
    const available = getAvailableSlots(tutor);
    const card = document.createElement("a");
    card.href = `booking.html?tutor=${tutor.id}`;
    card.className = "tutor-card";
    card.innerHTML = `
      <img src="${tutor.photo}" alt="${tutor.name}" />
      <h3>${tutor.name}</h3>
      <p class="tutor-meta">${tutor.subject} · Grades ${tutor.grades}</p>
      <p class="tutor-rate">$${tutor.rate}/hr</p>
      <span class="availability-badge ${available.length === 0 ? "none" : ""}">
        ${available.length > 0 ? available.length + " slot(s) open" : "Fully booked"}
      </span>
    `;
    card.addEventListener("click", () => {
      track("tutor_viewed", { tutor_name: tutor.name, subject: tutor.subject });
    });
    grid.appendChild(card);
  });
</script>
</body>
